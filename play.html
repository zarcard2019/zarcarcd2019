<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景音乐播放器 - 向天再借五百年</title>
    <style>
        /* 精简优化后的CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #1a2a6c, #b21f1f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .auto-play-btn {
            background: #ff8a00;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255,138,0,0.4);
        }
        .auto-play-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,138,0,0.6);
        }
        .status {
            color: rgba(255, 255, 255, 0.8);
            margin: 15px 0;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <h1>向天再借五百年</h1>
        <p class="status" id="statusText">准备播放中...</p>
        
        <audio id="audioPlayer" style="display:none">
            <source src="./xingtian500years.MP3" type="audio/mpeg">
        </audio>
        
        <button class="auto-play-btn" id="playButton">▶ 点击播放音乐</button>
    </div>

    <script>
        // 核心自动播放技术
        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const statusText = document.getElementById('statusText');
        
        // 解决iOS自动播放限制
        audio.setAttribute('playsinline', '');
        audio.setAttribute('webkit-playsinline', '');
        
        // 首次交互后解锁音频
        function unlockAudio() {
            // 尝试自动播放
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // 自动播放成功
                    statusText.textContent = "正在播放: 向天再借五百年";
                    playButton.style.display = 'none';
                    document.body.classList.add('playing');
                }).catch(error => {
                    // 自动播放失败时显示按钮
                    statusText.textContent = "自动播放被阻止: 请点击按钮播放";
                    playButton.style.display = 'block';
                });
            }
        }
        
        // 页面加载后尝试自动播放（带延迟）
        window.addEventListener('load', () => {
            // 设置3秒后尝试自动播放
            setTimeout(unlockAudio, 3000);
            
            // 添加触摸/点击事件监听
            document.body.addEventListener('click', () => {
                unlockAudio();
            });
        });
        
        // 按钮点击播放
        playButton.addEventListener('click', unlockAudio);
        
        // 自动隐藏按钮（当音频成功播放时）
        audio.addEventListener('play', () => {
            playButton.style.display = 'none';
            statusText.textContent = "正在播放: 向天再借五百年";
        });
        
        // 显示加载进度
        audio.addEventListener('progress', () => {
            if (audio.buffered.length > 0) {
                const percent = (audio.buffered.end(0) / audio.duration * 100).toFixed(1);
                statusText.textContent = `加载中: ${percent}%`;
            }
        });
    </script>
</body>
</html>
